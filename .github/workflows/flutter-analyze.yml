
name: Flutter Analyze

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-analyze-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Análise estática do Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4

      - name: Configurar Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze --no-pub
